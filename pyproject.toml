[project]
name = "omnitrace"
version = "0.1.0"
description = "OmniTrace - Spatiotemporal Causal Debugger for multi-agent AI systems"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
]
telemetry = [
    "clickhouse-connect",
    "opentelemetry-exporter-otlp",
]
checkpoint = [
    "langgraph-checkpoint-postgres",
]

interp = [
    "torch",
    "transformer-lens>=2,<3",
    # datasets 2.14 (pulled by transformer-lens 2.x) still calls pyarrow.PyExtensionType,
    # which pyarrow 15+ removed.
    "pyarrow>=8,<15",
    # pandas 3's native library is blocked by Windows application control on this machine.
    "pandas>=2.2,<2.3",
    # The PyPI sdist fails to build a wheel on Windows. Ship a pure wheel instead.
    "transformers-stream-generator==0.0.5",
]

[tool.uv.sources]
transformers-stream-generator = { path = "third_party/transformers_stream_generator-0.0.5-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
omnitrace = "src.cli:main"